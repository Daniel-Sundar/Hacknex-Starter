  // Paper + ground (all lit materials share one shader program on purpose)
  // ---------------------------------------------------------------------------
  const PAPER_W = 11.2, PAPER_D = 7.4;
  const paper = new THREE.Mesh(
    new THREE.PlaneGeometry(PAPER_W, PAPER_D),
    new THREE.MeshStandardMaterial({ color: C(0xe8d9b8), roughness: 0.92, metalness: 0, envMapIntensity: 0.55 })
  );
  paper.rotation.x = -PI / 2;
  paper.position.set(0, 0, 0.55);
  paper.receiveShadow = true;
  scene.add(paper);
  const under = new THREE.Mesh(   // a second sheet peeking out underneath
    new THREE.PlaneGeometry(PAPER_W, PAPER_D),
    new THREE.MeshStandardMaterial({ color: C(0xefe9dd), roughness: 0.95, metalness: 0, envMapIntensity: 0.5 })
  );
  under.rotation.set(-PI / 2, 0, 0.035);
  under.position.set(0.2, -0.006, 0.62);
  under.receiveShadow = true;
  scene.add(under);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.ShadowMaterial({ opacity: 0.13 }));
  ground.rotation.x = -PI / 2;
  ground.position.y = -0.012;
  ground.receiveShadow = true;
  scene.add(ground);

  // ---------------------------------------------------------------------------
  // Fountain pen. Root origin = nib tip; pen axis = local +Y (tip -> end cap).
  // The nib's upper (slit) face points to local -X.
  // Hierarchy: pen (root) -> penBody (nib, feed, grip, barrel)  +  penCap (removable cap)
  // ---------------------------------------------------------------------------
  const PEN_S = 0.8;                                   // uniform model scale
  const PEN = { end: 5.2 * PEN_S, capEnd: 0.42 * PEN_S, lieHeight: 0.279 * PEN_S };
  const pen = new THREE.Group();
  pen.name = 'pen';
  const penBody = new THREE.Group();
  penBody.name = 'penBody';
  const penCap = new THREE.Group();
  penCap.name = 'penCap';
  const penModel = new THREE.Group();                  // carries the scale; tip stays at the origin
  penModel.scale.setScalar(PEN_S);
  penModel.add(penBody, penCap);
  pen.add(penModel);
  scene.add(pen);

  // A soft, warm glow at the nib tip while it touches the paper.
  const glow = (function () {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const g = c.getContext('2d'), grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    grd.addColorStop(0, 'rgba(236,170,52,0.85)');
    grd.addColorStop(0.28, 'rgba(214,140,30,0.38)');
    grd.addColorStop(1, 'rgba(214,140,30,0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, 128, 128);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: Object.assign(new THREE.CanvasTexture(c), { encoding: THREE.sRGBEncoding }), transparent: true, opacity: 0, depthWrite: false, depthTest: false }));
    s.renderOrder = 10;
    s.scale.set(0.5, 0.5, 1);
    s.visible = false;
    scene.add(s);
    return s;
  })();
  let glowLevel = 0;

  const mat = {
    resin: new THREE.MeshStandardMaterial({ color: C(0x0c0e14), roughness: 0.075, metalness: 0.05, envMapIntensity: 1.7 }),
    grip: new THREE.MeshStandardMaterial({ color: C(0x0a0a0c), roughness: 0.16, metalness: 0.0, envMapIntensity: 1.3 }),
    gold: new THREE.MeshStandardMaterial({ color: C(0xe6b85c), roughness: 0.2, metalness: 1.0, envMapIntensity: 1.25 }),
    nib: new THREE.MeshStandardMaterial({ color: C(0xedc46a), roughness: 0.16, metalness: 1.0, envMapIntensity: 1.35 }),
    iridium: new THREE.MeshStandardMaterial({ color: C(0xc9ccd2), roughness: 0.25, metalness: 1.0 }),
    feed: new THREE.MeshStandardMaterial({ color: C(0x111113), roughness: 0.55, metalness: 0.0 }),
    slit: new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.9, metalness: 0.0, envMapIntensity: 0 })
  };
  const capMat = {                                     // the cap gets its own (fadeable) material instances
    resin: mat.resin.clone(),
    gold: mat.gold.clone(),
    dark: new THREE.MeshStandardMaterial({ color: C(0x08090c), roughness: 0.2, metalness: 0.1 })
  };
  Object.keys(capMat).forEach((k) => { capMat[k].transparent = true; capMat[k].opacity = 1; });

  // Thin open shells (nib, feed) are made two-sided geometrically, so every lit
  // material can use FrontSide and share a single shader program.
  function twoSided(geo) {
    const g = geo.index ? geo.toNonIndexed() : geo;
    const names = ['position', 'normal', 'uv'];
    const out = new THREE.BufferGeometry();
    for (const name of names) {
      const a = g.attributes[name];
      if (!a) continue;
      const n = a.count, s = a.itemSize, src = a.array, dst = new Float32Array(n * s * 2);
      dst.set(src);
      for (let t = 0; t < n; t += 3) {
        const order = [0, 2, 1];
        for (let k = 0; k < 3; k++) {
          const from = (t + order[k]) * s, to = (n + t + k) * s;
          for (let c = 0; c < s; c++) dst[to + c] = name === 'normal' ? -src[from + c] : src[from + c];
        }
      }
      out.setAttribute(name, new THREE.BufferAttribute(dst, s));
    }
    return out;
  }

  const SEG = 64;
  function part(parent, geo, material, y, rx) {
    const m = new THREE.Mesh(geo, material);
    m.position.y = y || 0;
    if (rx) m.rotation.x = rx;
    m.castShadow = true;
    m.receiveShadow = true;
    parent.add(m);
    return m;
  }
  const cyl = (rt, rb, h, open, ts, tl, rs) => new THREE.CylinderGeometry(rt, rb, h, rs || SEG, 1, !!open, ts || 0, tl == null ? PI * 2 : tl);
  const ring = (r, tube) => new THREE.TorusGeometry(r, tube, 12, SEG);
  const span = (a, b) => (a + b) / 2;                 // centre of an [a,b] section along the axis

  (function buildBody() {
    // nib: tapered, curved gold sheet (partial cone into a partial-cylinder shoulder)
    const NIB_ARC = PI * 0.78, NIB_START = -PI / 2 - NIB_ARC / 2;
    const NIB_L = 0.64, NIB_R = 0.168;
    part(penBody, twoSided(cyl(NIB_R, 0.0, NIB_L, true, NIB_START, NIB_ARC, 48)), mat.nib, NIB_L / 2);
    part(penBody, twoSided(cyl(0.176, NIB_R, 0.28, true, NIB_START, NIB_ARC, 48)), mat.nib, NIB_L + 0.14);
    part(penBody, new THREE.SphereGeometry(0.016, 16, 12), mat.iridium, 0.006);   // tipping on the very tip
    // slit + breather hole on the nib's upper face
    const k = NIB_R / NIB_L, alpha = Math.atan(k);
    const holeY = 0.47, holeR = k * holeY;
    const slit = part(penBody, new THREE.BoxGeometry(0.009, holeY - 0.02, 0.007), mat.slit, 0);
    slit.position.set(-holeR / 2 - 0.002, holeY / 2 + 0.01, 0);
    slit.rotation.z = alpha;
    slit.castShadow = false;
    const hole = part(penBody, new THREE.CircleGeometry(0.024, 24), mat.slit, 0);
    const holeN = new V3(-Math.cos(alpha), -Math.sin(alpha), 0);
    hole.position.set(-holeR, holeY, 0).addScaledVector(holeN, 0.003);
    hole.lookAt(hole.position.clone().add(holeN));
    hole.castShadow = false;
    for (let i = 0; i < 2; i++) {                    // engraved scroll lines near the shoulder
      const y = 0.6 + i * 0.07, r = k * y + 0.002;
      const arc = part(penBody, new THREE.TorusGeometry(r, 0.0035, 6, 32, PI * 0.5), mat.slit, y);
      arc.rotation.set(-PI / 2, 0, PI * 0.75);
      arc.castShadow = false;
    }
    // feed (black) under the nib, with comb fins
    part(penBody, twoSided(cyl(0.128, 0.03, 0.66, false, 0, PI, 32)), mat.feed, span(0.2, 0.86));
    for (let i = 0; i < 5; i++) {
      const y = 0.58 + i * 0.055, r = 0.03 + (0.128 - 0.03) * ((y - 0.2) / 0.66) + 0.008;
      const fin = part(penBody, new THREE.TorusGeometry(r, 0.012, 6, 20, PI * 0.9), mat.feed, y);
      fin.rotation.set(-PI / 2, 0, -PI * 0.45);
    }
    // grip section: glossy black, gently waisted, rolled lip, threads
    part(penBody, ring(0.183, 0.021), mat.grip, 0.845, PI / 2);
    part(penBody, cyl(0.176, 0.186, 0.4), mat.grip, span(0.84, 1.24));
    part(penBody, cyl(0.214, 0.176, 0.56), mat.grip, span(1.24, 1.8));
    part(penBody, cyl(0.222, 0.222, 0.2), mat.grip, span(1.8, 2.0));
    for (let i = 0; i < 4; i++) part(penBody, ring(0.223, 0.0075), mat.grip, 1.83 + i * 0.045, PI / 2);
    // gold trim ring between section and barrel
    part(penBody, cyl(0.279, 0.279, 0.07), mat.gold, span(2.0, 2.07));
    part(penBody, ring(0.279, 0.009), mat.gold, 2.004, PI / 2);
    part(penBody, ring(0.279, 0.009), mat.gold, 2.066, PI / 2);
    // barrel: dark polished resin
    part(penBody, cyl(0.262, 0.273, 2.68), mat.resin, span(2.07, 4.75));
    // barrel end: gold ring, tapered end piece, domed finial with a gold disc
    part(penBody, cyl(0.266, 0.266, 0.05), mat.gold, span(4.75, 4.8));
    part(penBody, cyl(0.2, 0.264, 0.3), mat.resin, span(4.8, 5.1));
    const dome = part(penBody, new THREE.SphereGeometry(0.2, 48, 16, 0, PI * 2, 0, PI / 2), mat.resin, 5.1);
    dome.scale.y = 0.45;
    part(penBody, cyl(0.075, 0.075, 0.012), mat.gold, 5.188);
  })();

  (function buildCap() {
    // cap covers nib + section: closed end at local -0.42, mouth at 2.0 (seats on the trim ring)
    part(penCap, cyl(0.292, 0.277, 2.0), capMat.resin, span(0.0, 2.0));
    part(penCap, ring(0.29, 0.011), capMat.gold, 1.995, PI / 2);
    part(penCap, cyl(0.295, 0.295, 0.17), capMat.gold, span(1.62, 1.79));       // wide cap band
    part(penCap, ring(0.291, 0.007), capMat.gold, 1.56, PI / 2);
    part(penCap, ring(0.291, 0.007), capMat.gold, 1.85, PI / 2);
    part(penCap, cyl(0.277, 0.236, 0.4), capMat.resin, span(-0.4, 0.0));       // tapered, flat-topped end
    part(penCap, ring(0.236, 0.013), capMat.gold, -0.4, PI / 2);
    const med = part(penCap, new THREE.RingGeometry(0.06, 0.15, 48), capMat.gold, -0.404, PI / 2);
    med.castShadow = false;
    const jewel = part(penCap, new THREE.CircleGeometry(0.06, 32), capMat.dark, -0.405, PI / 2);
    jewel.castShadow = false;
    // clip: anchored at the closed end, running toward the mouth, ball tip
    const clip = new THREE.Group();
    const base = part(clip, new THREE.BoxGeometry(0.13, 0.32, 0.07), capMat.gold, -0.2);
    base.position.z = 0.285;
    const arm = part(clip, new THREE.BoxGeometry(0.085, 1.62, 0.034), capMat.gold, 0.56);
    arm.position.z = 0.335;
    arm.rotation.x = -0.012;
    const ball = part(clip, new THREE.SphereGeometry(0.05, 20, 14), capMat.gold, 1.36);
    ball.position.z = 0.326;
    ball.scale.set(1, 1.35, 0.9);
    clip.rotation.y = -0.5;
    penCap.add(clip);
  })();

  // ---------------------------------------------------------------------------
  // Handwriting curves (world space, on the paper plane y = 0)
  // ---------------------------------------------------------------------------
  const B = GLYPH.bbox;
  const WORD_W = 8.6;
  const SC = WORD_W / (B[2] - B[0]);
  const CX = (B[0] + B[2]) / 2, CY = (B[1] + B[3]) / 2 + 40;
  const toWorld = (a) => { const o = []; for (let i = 0; i < a.length; i += 2) o.push(new V3((a[i] - CX) * SC, 0, -(a[i + 1] - CY) * SC)); return o; };
  const WORD = { minX: (B[0] - CX) * SC, maxX: (B[2] - CX) * SC, minZ: -(B[3] - CY) * SC, maxZ: -(B[1] - CY) * SC };
  function makeCurve(arr, divisions) {
    const c = new THREE.CatmullRomCurve3(toWorld(arr), false, 'centripetal');
    c.arcLengthDivisions = divisions;
    c.updateArcLengths();
    return c;
  }
  const WORD_CURVES = WORDS.map((W) => W.strokes.map((a) => makeCurve(a, Math.max(200, a.length * 40))));

  function blur(src, radius) {
    const n = src.length, out = new Float32Array(n), w = [];
    let ws = 0;
    for (let k = -radius; k <= radius; k++) { const v = Math.exp(-(k * k) / (2 * (radius / 2) * (radius / 2))); w.push(v); ws += v; }
    for (let i = 0; i < n; i++) {
      let acc = 0;
      for (let k = -radius; k <= radius; k++) acc += src[Math.min(n - 1, Math.max(0, i + k))] * w[k + radius];
      out[i] = acc / ws;
    }
    return out;
  }

  // Natural pacing: the nib slows in tight curves and cusps (2/3-power-law style),
  // eases in at the first touch and slows a little on the final exit stroke.
  // uAt(p): timeline progress p -> arc-length parameter u;  pAt(u): the inverse.
  function buildPacing(curve) {
    const M = 4000;
    const pts = curve.getSpacedPoints(M);
    const len = curve.getLength(), ds = len / M;
    const kap = new Float32Array(M + 1);
    const a = new V3(), b = new V3();
    for (let i = 1; i < M; i++) {
      a.subVectors(pts[i], pts[i - 1]);
      b.subVectors(pts[i + 1], pts[i]);
      kap[i] = a.angleTo(b) / ds;
    }
    kap[0] = kap[1]; kap[M] = kap[M - 1];
    const ks = blur(kap, 10);
    const speed = new Float32Array(M + 1);
    const T = new Float64Array(M + 1);
    for (let i = 0; i <= M; i++) {
      const s = i / M;
      let v = Math.pow(1 + ks[i] / 2.2, -1 / 3);
      v *= 0.3 + 0.7 * sstep(0, 0.018, s);
      v *= 0.55 + 0.45 * sstep(1, 0.975, s);
      speed[i] = v;
      if (i > 0) T[i] = T[i - 1] + ds / ((speed[i] + speed[i - 1]) / 2);
    }
    const total = T[M];
    for (let i = 0; i <= M; i++) T[i] /= total;
    const Q = 3000, U = new Float32Array(Q + 1);
    let j = 0;
    for (let q = 0; q <= Q; q++) {
      const target = q / Q;
      while (j < M - 1 && T[j + 1] < target) j++;
      const f = (target - T[j]) / Math.max(1e-9, T[j + 1] - T[j]);
      U[q] = clamp01((j + clamp01(f)) / M);
    }
    return {
      len,
      uAt(p) { p = clamp01(p) * Q; const i = Math.min(Q - 1, Math.floor(p)); return lerp(U[i], U[i + 1], p - i); },
      pAt(u) { u = clamp01(u) * M; const i = Math.min(M - 1, Math.floor(u)); return lerp(T[i], T[i + 1], u - i); },
      speedAt(u) { u = clamp01(u) * M; const i = Math.min(M - 1, Math.floor(u)); return lerp(speed[i], speed[i + 1], u - i); }
    };
  }
  const PACING = WORD_CURVES.map((cs, w) => cs.map((c, k) => (k < WORDS[w].pen ? buildPacing(c) : null)));

  // Smoothed tangents drive a small, stroke-dependent wobble of the pen while writing.
  const WOB_N = 300;
  function makeWobble(curve) {
    const tx = new Float32Array(WOB_N + 1), tz = new Float32Array(WOB_N + 1), t = new V3();
    for (let i = 0; i <= WOB_N; i++) { curve.getTangentAt(i / WOB_N, t); tx[i] = t.x; tz[i] = t.z; }
    return { x: blur(tx, 8), z: blur(tz, 8) };
  }
  const WOBBLE = WORD_CURVES.map((cs) => cs.map(makeWobble));
  function wobbleAt(wob, u) {
    const f = clamp01(u) * WOB_N, i = Math.min(WOB_N - 1, Math.floor(f));
    const env = sstep(0, 0.06, u) * sstep(1, 0.94, u);
    return { x: lerp(wob.x[i], wob.x[i + 1], f - i) * env, z: lerp(wob.z[i], wob.z[i + 1], f - i) * env };
  }

  // ---------------------------------------------------------------------------
  // Ink: a THREE.TubeGeometry along each curve, flattened into a slightly domed
  // ribbon with pressure-dependent width, revealed with geometry.setDrawRange
  // from the SAME arc-length parameter u that places the nib (curve.getPointAt(u)).
  // A per-vertex "written at" time lets fresh ink look wet and dry over ~2.4 s.
  // ---------------------------------------------------------------------------
  const INK = { half: 0.026, h: 0.0052, y: 0.0036, dry: 2.4 };
  const inkUniforms = { uTime: { value: 0 } };
  const inkMat = new THREE.MeshStandardMaterial({ color: C(0x1e1b4b), roughness: 0.52, metalness: 0.0, envMapIntensity: 0.35 });
  inkMat.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = inkUniforms.uTime;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nattribute float aT;\nuniform float uTime;\nvarying float vWet;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWet = 1.0 - clamp((uTime - aT) / ' + INK.dry.toFixed(2) + ', 0.0, 1.0);\nvWet *= vWet;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying float vWet;')
      .replace('#include <color_fragment>', '#include <color_fragment>\ndiffuseColor.rgb *= mix(1.0, 0.55, vWet);')
      .replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\nroughnessFactor = mix(roughnessFactor, 0.06, vWet);');
  };
  const WORD_FADE = WORDS.map(() => ({ value: 1 }));
  const WORD_MAT = WORD_FADE.map((fade) => {
    const m = inkMat.clone();
    m.transparent = true;
    m.onBeforeCompile = (shader) => {
      inkMat.onBeforeCompile(shader);
      shader.uniforms.uFade = fade;
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', '#include <common>\nuniform float uFade;')
        .replace('#include <color_fragment>', '#include <color_fragment>\ndiffuseColor.a *= uFade;');
    };
    m.customProgramCacheKey = () => 'ink-fade';
    return m;
  });

  const _cp = new V3();
  function placeCap(m, curve, u, w) {
    curve.getPointAt(u, _cp);
    m.position.set(_cp.x, _cp.y + INK.y, _cp.z);
    m.scale.set(w, INK.h, w);
  }
  function makeStroke(curve, N, R, widthAt, timeAt, mat) {
    const geo = new THREE.TubeGeometry(curve, N, 1, R, false);
    const pos = geo.attributes.position, nor = geo.attributes.normal;
    const aT = new Float32Array(pos.count);
    const P = new V3();
    const widths = new Float32Array(N + 1);
    for (let j = 0; j <= N; j++) {
      const u = j / N;
      curve.getPointAt(u, P);                       // TubeGeometry puts ring j at getPointAt(j / N)
      const w = widthAt(u), t = timeAt(u);
      widths[j] = w;
      for (let i = 0; i <= R; i++) {
        const idx = j * (R + 1) + i;
        const ox = pos.getX(idx) - P.x, oy = pos.getY(idx) - P.y, oz = pos.getZ(idx) - P.z;
        pos.setXYZ(idx, P.x + ox * w, P.y + INK.y + oy * INK.h, P.z + oz * w);
        const nx = ox / w, ny = oy / INK.h, nz = oz / w, l = Math.hypot(nx, ny, nz) || 1;
        nor.setXYZ(idx, nx / l, ny / l, nz / l);
        aT[idx] = t;
      }
    }
    geo.setAttribute('aT', new THREE.BufferAttribute(aT, 1));
    pos.needsUpdate = true;
    nor.needsUpdate = true;
    geo.computeBoundingSphere();
    geo.setDrawRange(0, 0);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.receiveShadow = true;
    mesh.frustumCulled = false;
    scene.add(mesh);
    const cap = (t) => {
      const g = new THREE.SphereGeometry(1, 20, 10);
      g.setAttribute('aT', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count).fill(t), 1));
      const m = new THREE.Mesh(g, mat);
      m.receiveShadow = true;
      m.visible = false;
      scene.add(m);
      return m;
    };
    const idxPerSeg = R * 6;
    return {
      curve, mesh, startCap: cap(timeAt(0)), headCap: cap(timeAt(0)), headT: -1, u: 0,
      widthAtU(u) { const f = clamp01(u) * N, i = Math.min(N - 1, Math.floor(f)); return lerp(widths[i], widths[i + 1], f - i); },
      reveal(u) {
        u = clamp01(u);
        this.u = u;
        geo.setDrawRange(0, Math.floor(u * N + 1e-6) * idxPerSeg);
        const on = u > 0;
        this.startCap.visible = on;
        this.headCap.visible = on;
        if (!on) return;
        placeCap(this.startCap, curve, 0, this.widthAtU(0));
        placeCap(this.headCap, curve, u, this.widthAtU(u));   // ink head = exactly curve.getPointAt(u)
        const t = timeAt(u);
        if (t !== this.headT) {
          this.headT = t;
          const at = this.headCap.geometry.attributes.aT;
          at.array.fill(t);
          at.needsUpdate = true;
        }
      }
    };
  }

  // pressure: downstrokes (toward the writer, +z) swell, upstrokes stay hairline; tapered entry/exit
  function pressureWidths(curve, N, base, o) {
    const raw = new Float32Array(N + 1), t = new V3();
    for (let j = 0; j <= N; j++) {
      curve.getTangentAt(j / N, t);
      raw[j] = 0.42 + 0.85 * sstep(-0.35, 0.85, t.z);
    }
    const sm = blur(raw, o.blur);
    return (u) => {
      const f = clamp01(u) * N, i = Math.min(N - 1, Math.floor(f));
      let w = base * lerp(sm[i], sm[i + 1], f - i);
      w *= o.in + (1 - o.in) * sstep(0, o.taperIn, u);
      w *= o.out + (1 - o.out) * sstep(1, 1 - o.taperOut, u);
      if (o.pool) w *= 1 + 0.16 * (1 - o.pool.speedAt(u));   // ink pools a little where the nib slows
      return w;
    };
  }

  const RAD = 10;
  const STROKES = WORD_CURVES.map((cs, w) => cs.map((curve, k) => {
    const tw = segOf('s' + w + '_' + k), t0 = tw.startTime(), dur = tw.duration();
    const pc = PACING[w][k];
    const N = Math.max(24, Math.round(curve.getLength() * 80));
    const width = pc
      ? pressureWidths(curve, N, INK.half, { blur: 10, in: 0.35, taperIn: 0.03, out: 0.45, taperOut: 0.04, pool: pc })
      : (u) => INK.half * 0.9 * (0.45 + 0.55 * sstep(0, 0.25, u)) * (0.4 + 0.6 * sstep(1, 0.7, u));
    return makeStroke(curve, N, RAD, width, (u) => t0 + (pc ? pc.pAt(u) : u) * dur, WORD_MAT[w]);
  }));

  // ---------------------------------------------------------------------------
  // Layout: camera framing + viewport-relative pen positions (recomputed on resize)
  // ---------------------------------------------------------------------------
  const LAY = {
    portrait: false, yawW: -0.32, tiltW: PI / 4,
    off: new V3(), top: new V3(), hover: new V3(), start: new V3(),
    rest: new V3(), restYaw: -0.12,
    lean: new THREE.Quaternion(),   // tips world-up so the upright pen reads exactly vertical on screen
    camPos: new V3(), target: new V3()
  };
  const _q1 = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _q3 = new THREE.Quaternion();
  const AX_Y = new V3(0, 1, 0), AX_Z = new V3(0, 0, 1);
  // orientation = yaw (about world Y) * tilt (about Z; 0 = nib down, PI = nib up) * roll (about the pen axis)
  function poseQuat(out, tilt, yaw, roll) {
    _q1.setFromAxisAngle(AX_Y, yaw);
    _q2.setFromAxisAngle(AX_Z, -tilt);
    _q3.setFromAxisAngle(AX_Y, roll);
    return out.copy(_q1).multiply(_q2).multiply(_q3);
  }
  function penAxis(tilt, yaw) { return new V3(0, 1, 0).applyQuaternion(poseQuat(new THREE.Quaternion(), tilt, yaw, 0)); }

  function layout() {
    const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight), aspect = w / h;
    const portrait = aspect < 0.85;
    LAY.portrait = portrait;
    LAY.yawW = portrait ? 0.72 : -0.32;
    camera.fov = layoutCam.fov = portrait ? 40 : 33;
    camera.aspect = layoutCam.aspect = aspect;
    camera.updateProjectionMatrix();
    layoutCam.updateProjectionMatrix();

    WORD_CURVES[0][0].getPointAt(0, LAY.start);
    LAY.hover.copy(LAY.start).add(new V3(0.12, 0.8, -0.08));
    LAY.rest.set(WORD.minX + 2.1, PEN.lieHeight, WORD.maxZ + (portrait ? 0.95 : 0.75));
    LAY.restYaw = portrait ? -0.22 : -0.1;

    // what must stay in frame: the word, the writing pen, the resting pen
    const pts = [];
    const m = 0.25;
    for (const x of [WORD.minX - m, WORD.maxX + m]) for (const z of [WORD.minZ - m, WORD.maxZ + m]) pts.push(new V3(x, 0, z));
    const ax = penAxis(LAY.tiltW, LAY.yawW);
    for (const p of [LAY.start, new V3(WORD.minX + 0.4, 0, 0), new V3(WORD.maxX, 0, 0)]) pts.push(p.clone().addScaledVector(ax, PEN.end * 0.95));
    const box = portrait ? { x0: -0.93, x1: 0.93, y0: -0.62, y1: 0.5 } : { x0: -0.9, x1: 0.9, y0: -0.74, y1: 0.66 };
    const elev = portrait ? 1.05 : 0.96;
    const dir = new V3(0, Math.sin(elev), Math.cos(elev));
    const target = new V3((WORD.minX + WORD.maxX) / 2, 0, 0.3);
    const ndc = new V3();
    const place = (d) => { layoutCam.position.copy(target).addScaledVector(dir, d); layoutCam.up.set(0, 1, 0); layoutCam.lookAt(target); layoutCam.updateMatrixWorld(true); };
    const bounds = () => {
      let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
      for (const p of pts) { ndc.copy(p).project(layoutCam); x0 = Math.min(x0, ndc.x); x1 = Math.max(x1, ndc.x); y0 = Math.min(y0, ndc.y); y1 = Math.max(y1, ndc.y); }
      return { x0, x1, y0, y1 };
    };
    let dist = 20;
    for (let iter = 0; iter < 5; iter++) {
      let lo = 2, hi = 400;
      for (let i = 0; i < 48; i++) {
        const mid = (lo + hi) / 2; place(mid);
        const b = bounds();
        if (b.x0 >= box.x0 && b.x1 <= box.x1 && b.y0 >= box.y0 && b.y1 <= box.y1) hi = mid; else lo = mid;
      }
      dist = hi; place(dist);
      const b = bounds();
      const hh = Math.tan(THREE.MathUtils.degToRad(layoutCam.fov) / 2) * dist, ww = hh * aspect;
      const right = new V3().setFromMatrixColumn(layoutCam.matrixWorld, 0);
      const camUp = new V3().setFromMatrixColumn(layoutCam.matrixWorld, 1);
      target.addScaledVector(right, ((b.x0 + b.x1) - (box.x0 + box.x1)) / 2 * ww)
            .addScaledVector(camUp, ((b.y0 + b.y1) - (box.y0 + box.y1)) / 2 * hh);
    }

    // Upright pen (nib up, cap on) standing in the top-right corner of the viewport.
    // Slide along the view ray through the corner until the pen's lower end sits at the
    // wanted height on screen; if that would put it below the paper, pull the camera back a bit.
    const ray = new THREE.Raycaster();
    const nx = portrait ? 0.56 : 0.74, nyTop = portrait ? 0.82 : 0.84;
    const bottomTarget = portrait ? 0.3 : -0.08;
    const penLen = PEN.end + PEN.capEnd;
    const T = new V3(), Bt = new V3(), axisUp = new V3();
    const screenVertical = () => {     // world-up projected into the plane that maps to the screen column x = nx
      ray.setFromCamera({ x: nx, y: -0.6 }, layoutCam);
      const lowDir = ray.ray.direction.clone();
      ray.setFromCamera({ x: nx, y: nyTop }, layoutCam);
      const n = new V3().crossVectors(ray.ray.direction, lowDir).normalize();
      axisUp.copy(UP).addScaledVector(n, -UP.dot(n)).normalize();
    };
    let dRay = 10;
    for (let attempt = 0; attempt < 40; attempt++) {
      place(dist);
      screenVertical();
      let lo = 0.5, hi = 600;
      for (let i = 0; i < 50; i++) {
        const d = (lo + hi) / 2;
        ray.ray.at(d, T);
        Bt.copy(T).addScaledVector(axisUp, -penLen);
        ndc.copy(Bt).project(layoutCam);
        if (ndc.y < bottomTarget) lo = d; else hi = d;
      }
      dRay = hi;
      ray.ray.at(dRay, T);
      if (T.y - penLen * axisUp.y >= 0.25) break;
      dist *= 1.04;
    }
    place(dist);
    LAY.target.copy(target);
    LAY.camPos.copy(layoutCam.position);
    screenVertical();
    ray.ray.at(dRay, T);
    LAY.lean.setFromUnitVectors(UP, axisUp);
    LAY.top.copy(T).addScaledVector(axisUp, -PEN.capEnd);
    // off-screen start: same depth, beyond the top-right edge
    ray.setFromCamera({ x: nx + 0.95, y: nyTop + 0.6 }, layoutCam);
    ray.ray.at(dRay, T);
    LAY.off.copy(T).addScaledVector(axisUp, -PEN.capEnd);
  }

  // ---------------------------------------------------------------------------
  // Pen pose as a pure function of the timeline state
  // ---------------------------------------------------------------------------
  const pose = { pos: new V3(), tilt: PI, yaw: 0, roll: PI / 2, lean: 1 };
  const _qi = new THREE.Quaternion(), _ql = new THREE.Quaternion();
  const _c1 = new V3(), _c2 = new V3();
  function bezier(out, p0, p1, p2, p3, t) {
    const it = 1 - t;
    return out.set(0, 0, 0)
      .addScaledVector(p0, it * it * it)
      .addScaledVector(p1, 3 * it * it * t)
      .addScaledVector(p2, 3 * it * t * t)
      .addScaledVector(p3, t * t * t);
  }
  function airMove(from, to, t, lift) {
    _c1.copy(from).addScaledVector(UP, lift);
    _c2.copy(to).addScaledVector(UP, lift);
    bezier(pose.pos, from, _c1, _c2, to, t);
  }
  function writingPose(wob, u) {
    const wb = wob == null ? { x: 0, z: 0 } : wobbleAt(wob, u);
    pose.tilt = LAY.tiltW + 0.035 * wb.z;
    pose.yaw = LAY.yawW - 0.05 * wb.x;
    pose.roll = 0.04 * wb.x;
  }
  const _pa = new V3(), _pb = new V3();
  const endPoint = (e, out) => WORD_CURVES[e.w][e.k].getPointAt(e.at, out);
  // the latest segment that has started (segments are in timeline order)
  function activeSeg() {
    for (let i = TRACK.length - 1; i >= 0; i--) if (S[TRACK[i].key] > 0) return TRACK[i];
    return null;
  }

  function computePose() {
    pose.lean = 0;
    writingPose(null);
    const g = activeSeg();
    if (g) {
      const v = S[g.key];
      if (g.kind === 'write') {                       // the nib rides the curve at the ink head
        const pc = PACING[g.w][g.k], u = pc ? pc.uAt(v) : v;
        WORD_CURVES[g.w][g.k].getPointAt(u, pose.pos);
        writingPose(WOBBLE[g.w][g.k], u);
      } else {
        airMove(endPoint(g.from, _pa), endPoint(g.to, _pb), v, g.lift);
      }
      return;
    }
    if (S.land >= 1) { pose.pos.copy(LAY.start); return; }
    if (S.land > 0) { pose.pos.lerpVectors(LAY.hover, LAY.start, S.land); return; }
    if (S.flip > 0) {                                  // turn nib-down, tilt to 45 deg, travel to the paper
      // The pen pivots about its nib in a plane facing the viewer, so the barrel swings
      // toward the camera (staying in frame) and then yaws round into the writing lean.
      const f = S.flip;
      _c1.lerpVectors(LAY.top, LAY.hover, 0.3);
      _c2.copy(LAY.hover).addScaledVector(UP, 1.3);
      bezier(pose.pos, LAY.top, _c1, _c2, LAY.hover, smoother(f));
      pose.tilt = lerp(PI, LAY.tiltW, 1 - Math.pow(1 - smooth(f), 1.6));
      pose.yaw = lerp(-PI / 2, LAY.yawW, smoother((f - 0.3) / 0.7));
      pose.roll = 0;
      pose.lean = 1 - smooth(f);
      return;
    }
    const e = S.enter;                                 // fly in from off-screen, upright, cap on
    pose.pos.lerpVectors(LAY.off, LAY.top, e);
    pose.tilt = PI;
    pose.yaw = -PI / 2;                                // nib up, nib face toward the viewer
    pose.roll = -(1 - e) * 1.6;
    pose.lean = 1;
  }

  let lastCapShadow = null;
  function applyState() {
    computePose();
    pen.position.copy(pose.pos);
    poseQuat(pen.quaternion, pose.tilt, pose.yaw, pose.roll);
    if (pose.lean > 0) pen.quaternion.premultiply(_ql.copy(_qi).slerp(LAY.lean, pose.lean));

    // cap: twist about its own axis, back off the thread, slide off past the nib, fade away
    const capOff = S.twist * 0.12 + S.pull * 2.35 + S.fade * 2.6;
    penCap.position.y = -capOff;
    penCap.rotation.y = -(S.twist * PI * 2.5 + S.pull * PI * 0.6);
    const op = 1 - S.fade;
    for (const k in capMat) capMat[k].opacity = op;
    penCap.visible = op > 0.004;
    const capShadow = op > 0.35;
    if (capShadow !== lastCapShadow) { lastCapShadow = capShadow; penCap.traverse((o) => { if (o.isMesh) o.castShadow = capShadow; }); }

    // ink: driven by the same parameters that drive the nib
    for (let w = 0; w < STROKES.length; w++) {
      WORD_FADE[w].value = 1 - S['f' + w];
      for (let k = 0; k < STROKES[w].length; k++) {
        const v = S['s' + w + '_' + k], pc = PACING[w][k];
        STROKES[w][k].reveal(v > 0 ? (pc ? pc.uAt(v) : v) : 0);
      }
    }
    const g = activeSeg();
    glowLevel += ((g && g.kind === 'write' && S[g.key] < 1 ? 1 : 0) - glowLevel) * 0.2;
    glow.visible = glowLevel > 0.01;
    glow.material.opacity = 0.7 * glowLevel;
    glow.position.copy(pen.position);
    glow.position.y += 0.015;
    inkUniforms.uTime.value = tl.time();
  }

  // ---------------------------------------------------------------------------
  // Controls, UI, loop
  // ---------------------------------------------------------------------------
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enablePan = false;
  controls.minPolarAngle = 0.12;
  controls.maxPolarAngle = PI / 2 - 0.12;              // never dip under the paper
  controls.rotateSpeed = 0.7;
  let userMoved = false;
  controls.addEventListener('start', () => { userMoved = true; });

  function frameCamera(force) {
    layout();
    const d = LAY.camPos.distanceTo(LAY.target);
    controls.minDistance = d * 0.45;
    controls.maxDistance = d * 2.2;
    if (force || !userMoved) {
      camera.position.copy(LAY.camPos);
      controls.target.copy(LAY.target);
    }
    camera.updateProjectionMatrix();
    controls.update();
  }
  frameCamera(true);

  window.addEventListener('resize', () => {
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    frameCamera(false);
  });

  const stageText = document.getElementById('stageText');
  const STAGE_COPY = { enter: 'Bringing in the pen', uncap: 'Uncapping', tilt: 'Settling to a 45° writing angle' };
  WORDS.forEach((W, w) => { STAGE_COPY['w' + w] = W.text + '…'; });
  let lastCopy = '';
  function updateCaption() {
    const t = tl.time();
    let copy;
    {
      let best = 'enter', bt = -1;
      for (const k in tl.labels) { const lt = tl.labels[k]; if (lt <= t + 1e-4 && lt > bt) { bt = lt; best = k; } }
      copy = STAGE_COPY[best] || '';
    }
    if (copy !== lastCopy) { stageText.textContent = copy; lastCopy = copy; }
  }

  document.getElementById('replay').addEventListener('click', () => {
    tl.restart();
    tl.play();
  });

  function render() {
    requestAnimationFrame(render);
    controls.update();
    applyState();
    updateCaption();
    renderer.render(scene, camera);
  }

  // GSAP animations are thenables (`await tl` resolves when it completes). Tools that await or
  // poll window.penTimeline (e.g. Playwright's waitForFunction) would block until the animation
  // ends, so the exposed timeline's `then` is shadowed. For a completion hook use
  // penTimeline.eventCallback('onComplete', fn).
  tl.then = undefined;
  window.penTimeline = tl;
  gsap.ticker.lagSmoothing(200, 33);   // a one-off hitch slows a frame instead of skipping ahead
  if (reduceMotion) tl.seek(segOf('f0').startTime() - 0.01).pause();
  // Let the ClearScript app know when the pen has finished (intro screen closes on this).
  tl.eventCallback('onComplete', function () { tl.play('loop'); });   // the words loop forever
  applyState();

  // Boot the GPU work (environment + first frame) a couple of frames after the page is
  // interactive, so slow shader compilation never blocks the first paint of the UI.
  let bootFrames = 0;
  requestAnimationFrame(function boot() {
    if (++bootFrames < 3) { requestAnimationFrame(boot); return; }
    buildEnvironment();
    renderer.compile(scene, camera);
    render();
    if (!reduceMotion) requestAnimationFrame(() => requestAnimationFrame(() => tl.play(0)));
  });
})();
</script>
</body>
</html>
